name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Compile Python source
        run: python -m compileall -q src app scripts starter_code tests
      - name: Release guard (no secrets, raw data, images or instructor material)
        run: python scripts/repo_guard.py
      - name: Run unit, integration and starter tests
        run: pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deployment/Dockerfile -t omnisupport-ai .
      - name: Smoke test container (health + RAG + agent)
        run: |
          docker run -d --name omni -p 8000:8000 omnisupport-ai
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/health && break || sleep 3; done
          curl -sf http://127.0.0.1:8000/health
          curl -sf -X POST http://127.0.0.1:8000/rag/ask -H 'content-type: application/json' -d '{"question":"Who must approve refunds above GBP 100?"}'
          curl -sf -X POST http://127.0.0.1:8000/agent/run -H 'content-type: application/json' -d '{"request":"Check order ORD00001001 and explain the delivery status."}'
          docker logs omni | tail -5
          docker rm -f omni
