[project]
name = "omnisupport-ai"
version = "1.0.0"
description = "OmniSupport AI capstone: connected retail-support AI prototype"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "data: needs the supplied primary data under data/raw (skipped when absent, e.g. in CI)",
    "heavy: needs torch/transformers/sentence embeddings (skipped when unavailable)",
]
